# Compiles the Biostrike iPhone app (biostrike/ios) without signing, so build
# errors show up before anyone opens Xcode. Compiler errors are reported as
# annotations on the commit.
on:
  push:
    paths:
      - 'biostrike/ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

name: iOS app build

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd biostrike/ios && xcodegen
      - name: Build for iPhone (unsigned)
        run: |
          cd biostrike/ios
          set -o pipefail
          xcodebuild -project BiostrikeCapture.xcodeproj -scheme BiostrikeCapture \
            -sdk iphoneos -configuration Debug -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | tail -40 || {
            grep -E '^/.*:[0-9]+:[0-9]+: error:' build.log | sort -u | head -40 | \
              sed -E 's#^(/[^:]*/biostrike/ios/)?([^:]+):([0-9]+):[0-9]+: error: (.*)#::error file=biostrike/ios/\2,line=\3::\4#'
            exit 1
          }
          grep -E ': warning:' build.log | grep '/Sources/' | sort -u | head -20 | \
            sed -E 's#^.*/(Sources/[^:]+):([0-9]+):[0-9]+: warning: (.*)#::warning file=biostrike/ios/\1,line=\2::\3#' || true
